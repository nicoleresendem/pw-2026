<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/webp" href="imgs/favicon.webp">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/tema.css">
</head>

<body>
    <header>
        <div>
            <img src="./imgs/logotransparente.webp" alt="Logotipo Ecocomunidade" class="logo">
        </div>
    </header>
    <div class="card-login">
        <h2>Faça seu login</h2>
        <form action="./home.html">
            <label>E-mail:</label>
            <input type="email" id="campo-email" required>

            <label>Senha:</label>
            <input type="password" id="campo-senha" required>

            <button class="botao-enviar" type="submit">Enviar</button>
            <a href="./cadastro.html" class="esqueceu-senha">Não tem conta? Cadastre-se</a>
        </form>
    </div>

    <button id="botao-claro-escuro">
        <span class="bolota">
            <img id="icone-tema" src="imgs/sol.webp" alt="Tema">
        </span>
    </button>

    <script src="js/login.js"></script>
    <script src="js/tema.js"></script>

</body>

</html>
