<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="icon" type="image/png" href="imgs/favicon.png">
    <link rel="stylesheet" href="./css/perfil.css">
</head>

<body>
    <button id="botao-claro-escuro">
        <span class="bolota">
            <img id="icone-tema" src="imgs/sol.png" alt="Tema">
        </span>
    </button>

    <div class="container-principal">
        <div class="coluna-esquerda">
            <div class="card-perfil">
                <h3 id="perfil-nome">Nome</h3>
                <p id="perfil-bio">Biografia</p>
            </div>
            <button class="botao-perfil">
                <img src="imgs/lapis-editar-perfil.png" alt="Icone">
                Editar perfil
            </button>
        </div>
        <img id="perfil-foto" src="imgs/foto-cristiano.png" alt="Fotografia de perfil" class="foto-perfil">
    </div>

    <div class="card-meus-posts">
        <h3>Meus posts</h3>
        <button id="btn-novo-post" class="botao-perfil">+ Novo post</button>
    </div>

    <p id="msg-lista-vazia" style="display: none; text-align: center; margin: 20px 0;">Lista vazia</p>

    <ul id="cards" class="grid-posts"></ul>

    <div id="modal-overlay" class="overlay-escondido">
        <div class="modal-caixa">
            <button id="fechar-modal">✖</button>
            <h2 id="modal-titulo"></h2>
            <img id="modal-imagem" src="" alt="Imagem do post">
            <p id="modal-texto"></p>
        </div>
    </div>

    <div id="modal-cadastro-overlay" class="overlay-escondido">
        <div class="modal-caixa">
            <button id="fechar-modal-cadastro">✖</button>
            <h2>Novo Post</h2>
            <form id="form-novo-post">
                <input type="text" id="novo-titulo" placeholder="Título do post" required>

                <label for="nova-imagem" style="font-size: 14px; font-weight: bold;">Escolha uma imagem:</label>
                <input type="file" id="nova-imagem" accept="image/*" required>

                <textarea id="novo-conteudo" placeholder="Conteúdo completo do post..." rows="4" required></textarea>
                <button type="submit" class="botao-perfil">Publicar</button>
            </form>
        </div>
    </div>

    <nav class="menu-inferior">
        <a href="./home.html" class="item-menu"><img src="./imgs/home_icon.png" alt="Início"></a>
        <a href="./blog.html" class="item-menu"><img src="./imgs/buscar_icon.png" alt="Buscar"></a>
        <a href="./mapa.html" class="item-menu"><img src="./imgs/pin.png" alt="Notificações"></a>
        <a href="./perfil.html" class="item-menu"><img src="./imgs/perfil_icon.png" alt="Perfil"></a>
    </nav>

    <script src="js/perfil.js"></script>
</body>

</html>
