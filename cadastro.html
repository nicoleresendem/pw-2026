<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="icon" type="image/webp" href="imgs/favicon.webp">
    <link rel="stylesheet" href="./css/cadastro.css">
</head>

<body>
    <header>
        <div>
            <img src="./imgs/logotransparente.webp" alt="Logotipo Ecocomunidade" class="logo">
        </div>
    </header>

    <div class="card-cadastro">
        <h2>Crie sua conta</h2>
        <form id="form-cadastro" action="./home.html">
            <label for="campo-nome">Nome completo:</label>
            <input type="text" id="campo-nome" required>

            <label for="campo-email">E-mail:</label>
            <input type="email" id="campo-email" required>

            <label for="campo-senha">Senha:</label>
            <input type="password" id="campo-senha" required>

            <label for="campo-confirmar-senha">Confirmar senha:</label>
            <input type="password" id="campo-confirmar-senha" required>

            <button class="botao-enviar" type="submit">Cadastrar</button>
            <a href="./login.html" class="link-login">Já tem uma conta? Faça login</a>
        </form>
    </div>

    <button id="botao-claro-escuro">
        <span class="bolota">
            <img id="icone-tema" src="imgs/sol.webp" alt="Tema">
        </span>
    </button>

    <script src="js/cadastro.js"></script>
</body>

</html>
