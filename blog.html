<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Coleta Seletiva</title>

    <link rel="stylesheet" href="css/blog.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="blog-header">
        <div class="search-bar">
            <input type="text" placeholder="Buscar conteúdo...">
            <button type="submit" aria-label="Pesquisar">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <nav class="tags-container">
            <span class="tag tag-reciclagem">Reciclagem</span>
            <span class="tag tag-upcycling">Upcycling</span>
            <span class="tag tag-educacao">Educação</span>
            <span class="tag tag-noticias">Notícias</span>
        </nav>
    </header>

    <main class="blog-content">
        <article class="card card-full">
            <div class="card-image-wrapper">
                <img src="imgs/lixo_eletronico.jpg" alt="Pilha de lixo eletrônico antigo">
                <i class="fa-solid fa-heart heart-icon"></i>
            </div>
            <div class="card-info">
                <h2>Como descartar lixo eletrônico?</h2>
                <i class="fa-solid fa-ellipsis ellipsis-icon"></i>
            </div>
        </article>

        <article class="card card-full">
            <div class="card-image-wrapper">
                <img src="imgs/compostagem.jpg" alt="Pessoa segurando cascas de frutas para compostagem">
                <i class="fa-solid fa-heart heart-icon"></i>
            </div>
            <div class="card-info">
                <h2>Um guia para a compostagem</h2>
                <i class="fa-solid fa-ellipsis ellipsis-icon"></i>
            </div>
        </article>

        <div class="card-grid-half">
            <article class="card card-half">
                <div class="card-image-wrapper">
                    <img src="imgs/lixeiras.jpg" alt="Lixeiras de coleta seletiva coloridas">
                    <i class="fa-solid fa-heart heart-icon"></i>
                </div>
                <div class="card-info">
                    <h2>Como separar o lixo</h2>
                </div>
            </article>

            <article class="card card-half">
                <div class="card-image-wrapper">
                    <img src="imgs/consumo-e-producao-OS12.png" alt="Símbolo do ODS 12 da ONU">
                    <i class="fa-solid fa-heart heart-icon"></i>
                </div>
                <div class="card-info">
                    <h2>Conheça as ODS da ONU</h2>
                </div>
            </article>
        </div>

        <article class="card card-full">
            <div class="card-image-wrapper">
                <img src="imgs/pobreza.jpg" alt="Moradias precárias e impacto social">
                <i class="fa-solid fa-heart heart-icon"></i>
            </div>
            <div class="card-info">
                <h2>O impacto social do lixo nas comunidades</h2>
                <i class="fa-solid fa-ellipsis ellipsis-icon"></i>
            </div>
        </article>
    </main>
</body>

</html>
