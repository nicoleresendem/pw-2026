<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="icon" type="image/webp" href="imgs/favicon.webp">
    <link rel="stylesheet" href="css/blog.css">
    <link rel="stylesheet" href="css/tema.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <button id="botao-claro-escuro">
        <span class="bolota">
            <img id="icone-tema" src="imgs/sol.webp" alt="Tema">
        </span>
    </button>

    <header class="blog-header">
        <div class="search-bar">
            <input type="text" id="busca-blog" placeholder="Buscar conteúdo...">
            <button type="submit" aria-label="Pesquisar">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <nav class="tags-container">
            <span class="tag tag-reciclagem" data-tag="reciclagem">Reciclagem</span>
            <span class="tag tag-upcycling" data-tag="upcycling">Upcycling</span>
            <span class="tag tag-educacao" data-tag="educacao">Educação</span>
            <span class="tag tag-noticias" data-tag="noticias">Notícias</span>
        </nav>
    </header>

    <main class="blog-content" id="blog-content"></main>

    <div id="modal-overlay" class="overlay-escondido">
        <div class="modal-caixa">
            <button id="fechar-modal">✖</button>
            <h2 id="modal-titulo"></h2>
            <img id="modal-imagem" src="" alt="Imagem do post">
            <p id="modal-texto"></p>
        </div>
    </div>

    <nav class="menu-inferior">
        <a href="./home.html" class="item-menu"><img src="./imgs/homeNselecionada.webp" alt="Início"></a>
        <a href="./blog.html" class="item-menu"><img src="./imgs/buscaSelecionada.webp" alt="Buscar"></a>
        <a href="./mapa.html" class="item-menu"><img src="./imgs/pin.webp" alt="Notificações"></a>
        <a href="./perfil.html" class="item-menu"><img src="./imgs/perfil_icon.webp" alt="Perfil"></a>
    </nav>

    <script src="js/blog.js"></script>
    <script src="js/tema.js"></script>

</body>

</html>
