<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecocomunidade</title>
    <link rel="icon" type="image/webp" href="imgs/favicon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/home.css">
    <link rel="stylesheet" href="./css/tema.css">
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="./imgs/logotransparente.webp" alt="Logotipo Ecocomunidade">
        </div>
    </header>

    <main>
        <button id="botao-claro-escuro">
            <span class="bolota">
                <img id="icone-tema" src="imgs/sol.webp" alt="Tema">
            </span>
        </button>
        <div class="banner-principal">
            <div class="carrossel-trilho" id="trilho">
                <img src="./imgs/lampada.webp" alt="Imagem de uma lâmpada acesa">
                <img src="./imgs/paisagem.webp" alt="Imagem de uma paisagem">
                <img src="./imgs/plantinha.webp" alt="Imagem de uma plantinha">
            </div>
            <div class="carrossel-indicadores" id="indicadores">
                <span class="bolinha ativa"></span>
                <span class="bolinha"></span>
                <span class="bolinha"></span>
            </div>
        </div>
        <div class="grid-cards">

            <a href="./mapa.html">
                <div class="card-mapa">
                    <img src="./imgs/mapa.webp" alt="Mapa de rotas e ruas verdes">
                    <div class="info-mapa">
                        <p>Encontre pontos de coleta</p>
                    </div>
                </div>
            </a>

            <a href="./blog.html">

                <div class="container-imagem">
                    <img src="./imgs/ambiente.webp" alt="Imagem árvore em um globo">
                    <p class="texto-sobre-imagem">Participe do nosso fórum interativo</p>
                </div>
            </a>
        </div>

        <section class="caixa-informativa">
            <p>Aqui, você encontra informação, troca experiências e participa de ações que ajudam a construir um
                futuro
                mais sustentável!</p>
        </section>
    </main>

    <nav class="menu-inferior">
        <a href="./home.html" class="item-menu"><img src="./imgs/home_icon.webp" alt="Início"></a>
        <a href="./blog.html" class="item-menu"><img src="./imgs/buscar_icon.webp" alt="Buscar"></a>
        <a href="./mapa.html" class="item-menu"><img src="./imgs/pin.webp" alt="Notificações"></a>
        <a href="./perfil.html" class="item-menu"><img src="./imgs/perfil_icon.webp" alt="Perfil"></a>
    </nav>
    <script src="js/home.js"></script>
    <script src="js/tema.js"></script>

</body>

</html>
