<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecocomunidade</title>
    <link rel="stylesheet" href="./css/home.css">
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="./imgs/logo.jpg" alt="Logotipo Ecocomunidade">
        </div>
    </header>

    <main>
        <section class="banner-principal">
            <img src="./imgs/lampada.png" alt="Planta crescendo dentro de uma lâmpada">
        </section>

        <div class="grid-cards">

            <div class="card-mapa">
                <img src="./imgs/mapa.png" alt="Mapa de rotas e ruas verdes">
                <div class="info-mapa">
                    <p>Encontre pontos de coleta</p>
                </div>
            </div>

            <div class="container-imagem">
                <img src="./imgs/ambiente.png" alt="Imagem árvore em um globo">
                <p class="texto-sobre-imagem">Participe do nosso fórum interativo</p>
            </div>

        </div>

        <section class="caixa-informativa">
            <p>Aqui, você encontra informação, troca experiências e participa de ações que ajudam a construir um futuro
                mais sustentável!</p>
        </section>
    </main>

    <nav class="menu-inferior">
        <a href="#" class="item-menu"><img src="./imgs/home_icon.png" alt="Início"></a>
        <a href="#" class="item-menu"><img src="./imgs/buscar_icon.png" alt="Buscar"></a>
        <a href="#" class="item-menu"><img src="./imgs/notificacao_icon.png" alt="Notificações"></a>
        <a href="#" class="item-menu"><img src="./imgs/perfil_icon.png" alt="Perfil"></a>
    </nav>

</body>

</html>
